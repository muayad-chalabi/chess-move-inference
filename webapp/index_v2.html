<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess CV — Digital Twin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<style>
:root {
  --bg: #0f172a;
  --panel-bg: rgba(30, 41, 59, 0.6);
  --border: rgba(255, 255, 255, 0.08);
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.4);
  --success: #10b981;
  --danger: #ef4444;
  --warn: #f59e0b;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(circle at top right, #1e293b, #020617);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
}
h1 {
  font-weight: 800;
  font-size: 2.2rem;
  background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
.layout {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 2rem;
  width: 100%;
  max-width: 1200px;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
}
.panel {
  background: var(--panel-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: 0 24px 40px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.panel-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.75rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
button {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s ease;
}
button:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.1);
  transform: translateY(-1px);
}
button.btn-primary {
  background: linear-gradient(135deg, #38bdf8, #818cf8);
  border: none;
  color: #000;
  font-weight: 800;
  box-shadow: 0 8px 20px var(--accent-glow);
}
button.btn-primary:hover:not(:disabled) {
  box-shadow: 0 12px 25px var(--accent-glow);
  transform: translateY(-2px);
}
button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Status Badge */
.status { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); }
.dot.offline { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

/* Segmentation Control */
.segment {
  display: flex;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.segment button {
  flex: 1; border: none; border-radius: 0; background: transparent; padding: 0.6rem; color: var(--text-muted);
}
.segment button.active { background: var(--accent); color: #000; }

/* Occupancy Grid */
.occ-container { display: flex; justify-content: center; align-items: center; gap: 1rem; }
.occ-grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
  background: #000; padding: 4px; border-radius: 8px; width: 160px; height: 160px;
}
.occ-cell { background: #1e293b; transition: all 0.2s; cursor: pointer; border-radius: 2px; }
.occ-cell.filled { background: var(--success); box-shadow: 0 0 8px var(--success); }

/* Engine Config */
.engine-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.5rem; }
select {
  background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text);
  padding: 0.4rem; border-radius: 6px; font-family: inherit; font-size: 0.85rem; outline: none;
}
select option { background: #1e293b; }

/* Reminder Toast */
.reminder {
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid rgba(245, 158, 11, 0.4);
  color: #fbbf24;
  padding: 1rem;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  animation: slideIn 0.3s ease-out;
  display: none;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Log */
.log-box {
  background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.75rem; height: 180px; overflow-y: auto; font-family: 'Roboto Mono', monospace;
  font-size: 0.8rem; display: flex; flex-direction: column; gap: 0.4rem; color: #cbd5e1;
}
.log-entry { border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.3rem; }
.log-entry.info { color: var(--accent); }
.log-entry.success { color: var(--success); }
.log-entry.error { color: var(--danger); }

/* Editor Modal */
#editor-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
  display: none; justify-content: center; align-items: center; z-index: 1000;
}
.editor-content {
  background: #0f172a; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 2rem; width: 90%; max-width: 800px; display: flex; gap: 2rem; flex-wrap: wrap;
}
.piece-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; }
.piece-btn { font-size: 1.5rem; padding: 0.5rem; background: rgba(255,255,255,0.05); text-align: center; border-radius: 8px; cursor: pointer; border: 2px solid transparent;}
.piece-btn:hover { background: rgba(255,255,255,0.1); }
.piece-btn.selected { border-color: var(--accent); background: rgba(56,189,248,0.2); }

#ed-board-wrap { position: relative; width: 360px; height: 360px; }
#ed-sq-overlay { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
.ed-cell { cursor: pointer; }
.ed-cell:hover { background: rgba(56,189,248,0.4); }

</style>
</head>
<body>

<h1>♟ Chess CV — Digital Twin</h1>

<div class="layout">
  
  <!-- LEFT: Board and Reminders -->
  <div class="panel">
    <div class="panel-title">
      Digital Board State
      <div class="status"><div class="dot offline" id="sf-dot"></div> <span id="sf-status">Offline</span></div>
    </div>
    
    <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-between;">
        <button onclick="startStockfish()">▶ Launch Stockfish</button>
        <button onclick="openEditor()">✏ Edit Board</button>
    </div>

    <div style="display: flex; justify-content: center;">
      <div id="board" style="width: 100%; max-width: 500px;"></div>
    </div>

    <!-- Reminder Toast -->
    <div id="reminder-toast" class="reminder">
      <span id="reminder-text">Sync required: Move White Knight to f3</span>
      <button onclick="clearReminder()" style="background: rgba(245,158,11,0.2); border: 1px solid #fbbf24; color: #fbbf24; padding: 0.3rem 0.6rem; font-size: 0.8rem;">Dismiss</button>
    </div>

  </div>

  <!-- RIGHT: Controls -->
  <div class="panel" style="gap: 1rem;">
    
    <!-- Inference Trigger -->
    <button id="btn-detect" class="btn-primary" style="font-size: 1.1rem; padding: 1rem;" onclick="triggerInference()">
      🔍 Infer Move <kbd style="font-weight: 400; opacity: 0.8; font-size: 0.9rem; margin-left: 8px;">[Space]</kbd>
    </button>

    <!-- Occupancy -->
    <div class="panel-title" style="margin-top: 1rem;">Occupancy Source</div>
    <div class="segment">
      <button id="src-auto" class="active" onclick="setOccMode('auto')">Auto (FEN)</button>
      <button id="src-camera" onclick="setOccMode('camera')">Camera</button>
      <button id="src-manual" onclick="setOccMode('manual')">Manual</button>
    </div>
    
    <div class="occ-container">
      <div class="occ-grid" id="occ-grid"></div>
      <div style="display: flex; flex-direction: column; gap: 0.5rem; justify-content: center;">
        <button id="btn-snap" onclick="triggerSnapshot()" style="display: none;">📸 Snapshot</button>
        <button id="btn-sync" onclick="syncOccMap()" style="font-size: 0.8rem;">🔄 Sync</button>
      </div>
    </div>

    <!-- Engine Config -->
    <div class="panel-title" style="margin-top: 1rem;">Stockfish Engine</div>
    <div class="engine-row">
      <span style="font-weight: 600; color: #cbd5e1;">White</span>
      <select id="sf-white">
        <option value="none">Manual / Human</option>
        <option value="calc">Calculate Only</option>
        <option value="show">Show Best Move</option>
        <option value="play" selected>Play Best Move</option>
      </select>
    </div>
    <div class="engine-row">
      <span style="font-weight: 600; color: #cbd5e1;">Black</span>
      <select id="sf-black">
        <option value="none" selected>Manual / Human</option>
        <option value="calc">Calculate Only</option>
        <option value="show">Show Best Move</option>
        <option value="play">Play Best Move</option>
      </select>
    </div>

    <!-- Logs -->
    <div class="panel-title" style="margin-top: 1rem;">Event Log</div>
    <div class="log-box" id="log"></div>

  </div>
</div>

<!-- Editor Modal -->
<div id="editor-modal">
  <div class="editor-content">
    <div style="flex: 1;">
      <h3 style="margin-bottom: 1rem; color: var(--accent);">Board Editor</h3>
      <div id="ed-board-wrap">
        <div id="ed-board" style="width: 360px;"></div>
        <div id="ed-sq-overlay"></div>
      </div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 1.5rem;">
      <div>
        <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Select Piece</div>
        <div class="piece-grid" id="ed-pieces"></div>
      </div>
      <div>
        <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Side to Move</div>
        <div class="segment">
          <button id="ed-turn-w" class="active" onclick="setEdTurn('w')">White</button>
          <button id="ed-turn-b" onclick="setEdTurn('b')">Black</button>
        </div>
      </div>
      <div style="display: flex; gap: 0.5rem; margin-top: auto;">
        <button onclick="closeEditor()" style="flex: 1;">Cancel</button>
        <button onclick="applyEditor()" class="btn-primary" style="flex: 1;">Save State</button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
// --- State ---
let game = new Chess();
let board, edBoard;
let occMode = 'auto'; // 'auto' | 'camera' | 'manual'
let occMap = Array(8).fill(0).map(() => Array(8).fill(0));
let preMoveFen = null;
let lastMoveHint = null;

// Pieces for editor
const PIECES = [
  {l:'♙',c:'wP'},{l:'♘',c:'wN'},{l:'♗',c:'wB'},{l:'♖',c:'wR'},{l:'♕',c:'wQ'},{l:'♔',c:'wK'},
  {l:'♟',c:'bP'},{l:'♞',c:'bN'},{l:'♝',c:'bB'},{l:'♜',c:'bR'},{l:'♛',c:'bQ'},{l:'♚',c:'bK'},
  {l:'✕',c:'empty'}
];
let edSelected = PIECES[0];
let edTurn = 'w';
let edGame = new Chess();

// --- Init UI ---
$(document).ready(() => {
  // Init Board
  board = Chessboard('board', {
    draggable: true,
    position: 'start',
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDragStart: (source, piece) => {
      if(game.game_over()) return false;
      if((game.turn() === 'w' && piece.startsWith('b')) || (game.turn() === 'b' && piece.startsWith('w'))) return false;
    },
    onDrop: (source, target) => {
      if(source === target) return;
      preMoveFen = game.fen(); // Save state before move
      const mv = game.move({from: source, to: target, promotion: 'q'});
      if(mv === null) {
        preMoveFen = null;
        return 'snapback';
      }
      board.position(game.fen());
      
      // Remind user if it was a manual UI move
      showReminder(`Physical board out of sync. Please move ${source} to ${target}.`);
      
      if(occMode === 'auto') updateOccFromFen();
    }
  });
  
  // Init Occ Grid
  for(let r=0; r<8; r++) {
    for(let c=0; c<8; c++) {
      $('#occ-grid').append(`<div class="occ-cell" id="oc-${r}-${c}" onclick="toggleOcc(${r},${c})"></div>`);
    }
  }
  updateOccFromFen();
  
  // Start server polling
  setInterval(pollServer, 3000);
  pollServer();

  // Spacebar listener
  document.addEventListener('keydown', e => {
    if(e.code === 'Space' && !e.repeat && !$('#editor-modal').is(':visible')) {
      e.preventDefault();
      triggerInference();
    }
  });
});

// --- Logging ---
function log(msg, type='') {
  const t = new Date().toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit'});
  $('#log').prepend(`<div class="log-entry ${type}">[${t}] ${msg}</div>`);
}

// --- Reminder ---
function showReminder(msg) {
  $('#reminder-text').text(msg);
  $('#reminder-toast').css('display', 'flex');
}
function clearReminder() {
  $('#reminder-toast').hide();
}

// --- Occupancy ---
function setOccMode(m) {
  occMode = m;
  $('.segment button').removeClass('active');
  $(`#src-${m}`).addClass('active');
  $('#btn-snap').toggle(m === 'camera');
  if(m === 'auto') updateOccFromFen();
  log(`Occupancy mode: ${m}`, 'info');
}

function toggleOcc(r, c) {
  if(occMode !== 'manual') return;
  occMap[r][c] = occMap[r][c] > 0.5 ? 0.0 : 1.0;
  renderOccUI();
}

function renderOccUI() {
  for(let r=0; r<8; r++) {
    for(let c=0; c<8; c++) {
      $(`#oc-${r}-${c}`).toggleClass('filled', occMap[r][c] > 0.5);
    }
  }
}

function updateOccFromFen() {
  const tmp = new Chess(game.fen());
  for(let r=0; r<8; r++) {
    for(let c=0; c<8; c++) {
      const sq = String.fromCharCode(97+c) + (8-r);
      occMap[r][c] = tmp.get(sq) ? 1.0 : 0.0;
    }
  }
  renderOccUI();
}

function syncOccMap() {
  if(occMode === 'auto') updateOccFromFen();
  else if(occMode === 'camera') triggerSnapshot();
}

async function triggerSnapshot() {
  $('#btn-snap').prop('disabled', true).text('Snapping...');
  log('Calling vision service...', 'info');
  try {
    const res = await fetch('/vision/service/capture?frames=15', {method:'POST'});
    if(!res.ok) throw new Error(await res.text());
    const data = await res.json();
    occMap = data.occupancy;
    renderOccUI();
    log('Snapshot complete', 'success');
  } catch(e) {
    log(`Vision error: ${e.message}`, 'error');
  } finally {
    $('#btn-snap').prop('disabled', false).text('📸 Snapshot');
  }
}

// --- Server & Engine ---
async function pollServer() {
  try {
    const r = await fetch('/stockfish/health');
    if(r.ok) {
      $('#sf-dot').attr('class', 'dot online');
      $('#sf-status').text('Engine Online');
    } else throw 0;
  } catch {
    $('#sf-dot').attr('class', 'dot offline');
    $('#sf-status').text('Engine Offline');
  }
}

async function startStockfish() {
  try {
    log('Starting Stockfish...', 'info');
    const r = await fetch('/stockfish/start', {method: 'POST'});
    if(!r.ok) throw new Error();
    pollServer();
  } catch(e) {
    log('Failed to start Stockfish', 'error');
  }
}

// --- Inference ---
async function triggerInference() {
  const fen = preMoveFen || game.fen(); // Diff from preMoveFen if we dragged, otherwise current
  
  log('Inferring move from occupancy...', 'info');
  $('#btn-detect').prop('disabled', true);
  
  try {
    const res = await fetch('/stockfish/infer_move', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({fen: fen, occupancy_map: occMap})
    });
    
    if(!res.ok) throw new Error('Inference request failed');
    const d = await res.json();
    
    if(!d.best_move || d.best_move === '0000') {
      log(`No physical move detected (conf: ${d.confidence?.toFixed(2)})`, 'error');
      // Revert drag visually if we had one
      if(preMoveFen) { game.undo(); board.position(game.fen()); preMoveFen = null; }
    } else {
      log(`Detected move: ${d.best_move} (conf: ${d.confidence.toFixed(2)})`, 'success');
      
      if(preMoveFen) { game.undo(); } // Undo UI drag to cleanly apply
      game.move(d.best_move, {sloppy: true});
      board.position(game.fen());
      
      preMoveFen = null;
      clearReminder(); // Detected move successfully, physical board in sync!
      if(occMode === 'auto') updateOccFromFen();
      
      // Check engine response
      handleEngineTurn();
    }
  } catch(e) {
    log(`Inference error: ${e.message}`, 'error');
    if(preMoveFen) { game.undo(); board.position(game.fen()); preMoveFen = null; }
  } finally {
    $('#btn-detect').prop('disabled', false);
  }
}

async function handleEngineTurn() {
  if(game.game_over()) { log('Game over!', 'info'); return; }
  
  const turn = game.turn();
  const mode = turn === 'w' ? $('#sf-white').val() : $('#sf-black').val();
  
  if(mode === 'none') return;
  
  log('Engine calculating...', 'info');
  try {
    const res = await fetch('/stockfish/best_move', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({fen: game.fen()})
    });
    const d = await res.json();
    
    if(d.best_move) {
      if(mode === 'show' || mode === 'calc') {
        log(`Best move suggestion: ${d.best_move}`, 'success');
      }
      if(mode === 'play') {
        game.move(d.best_move, {sloppy: true});
        board.position(game.fen());
        log(`Engine plays: ${d.best_move}`, 'success');
        showReminder(`Engine moved. Please reflect ${d.best_move} on the physical board.`);
        if(occMode === 'auto') updateOccFromFen();
      }
    }
  } catch(e) {
    log('Engine error', 'error');
  }
}

// --- Editor ---
function openEditor() {
  edGame = new Chess(game.fen());
  edTurn = game.turn();
  
  // Render Pieces
  $('#ed-pieces').empty();
  PIECES.forEach(p => {
    $('#ed-pieces').append(`<div class="piece-btn ${p.c===edSelected.c?'selected':''}" onclick="selPiece('${p.c}')">${p.l}</div>`);
  });
  
  setEdTurn(edTurn);
  
  if(!edBoard) {
    edBoard = Chessboard('ed-board', { position: edGame.fen(), draggable: false, pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
    
    // Build Overlay
    const sqs = ['a','b','c','d','e','f','g','h'];
    for(let r=0; r<8; r++) {
      for(let c=0; c<8; c++) {
        const sq = sqs[c] + (8-r);
        $('#ed-sq-overlay').append(`<div class="ed-cell" onclick="edClick('${sq}')"></div>`);
      }
    }
  } else {
    edBoard.position(edGame.fen());
  }
  
  $('#editor-modal').css('display', 'flex');
}

function closeEditor() { $('#editor-modal').hide(); }

function selPiece(c) {
  edSelected = PIECES.find(p => p.c === c);
  $('.piece-btn').removeClass('selected');
  $(`.piece-btn:contains('${edSelected.l}')`).addClass('selected');
}

function setEdTurn(t) {
  edTurn = t;
  $('#ed-turn-w, #ed-turn-b').removeClass('active');
  $(`#ed-turn-${t}`).addClass('active');
}

function edClick(sq) {
  edGame.remove(sq);
  if(edSelected.c !== 'empty') {
    edGame.put({type: edSelected.c[1].toLowerCase(), color: edSelected.c[0]}, sq);
  }
  edBoard.position(edGame.fen());
}

function applyEditor() {
  const parts = edGame.fen().split(' ');
  parts[1] = edTurn; parts[2] = '-'; parts[3] = '-';
  try {
    game = new Chess(parts.join(' '));
    board.position(game.fen());
    log('Board state manually edited', 'info');
    if(occMode === 'auto') updateOccFromFen();
    showReminder("Board edited. Ensure physical board matches digital state.");
  } catch(e) {
    log('Invalid FEN produced', 'error');
  }
  closeEditor();
}

</script>
</body>
</html>
