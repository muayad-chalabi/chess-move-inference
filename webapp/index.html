<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess CV Webapp</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
        }
        body {
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-weight: 800;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            display: flex;
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            flex: 1;
            min-width: 400px;
        }
        #board {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            width: fit-content;
        }
        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 0.75rem;
        }
        .indicator.online { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .indicator.offline { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }
        .occupancy-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            background: #000;
            padding: 2px;
            border-radius: 0.5rem;
            aspect-ratio: 1;
            width: 100%;
            max-width: 300px;
        }
        .occ-cell {
            background: #fff;
            aspect-ratio: 1;
            border-radius: 2px;
            transition: background-color 0.3s ease;
        }
        .log-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            padding: 1rem;
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .log-entry {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.25rem;
        }
        .log-entry strong { color: var(--accent); }
    </style>
</head>
<body>

    <h1>Chess Computer Vision UI</h1>

    <div class="container">
        <!-- Left: Chessboard -->
        <div class="glass-panel">
            <h3 style="margin-top:0">Live Board</h3>
            <div id="board"></div>
        </div>

        <!-- Right: Controls & Occupancy Map -->
        <div class="glass-panel controls">
            <div class="status-badge" id="server-status">
                <div class="indicator offline" id="status-indicator"></div>
                <span id="status-text">Server Offline</span>
            </div>

            <div class="slider-container">
                <label for="noise-slider">Camera Noise Level: <span id="noise-val">0.05</span></label>
                <input type="range" id="noise-slider" min="0" max="0.5" step="0.01" value="0.05">
            </div>

            <div>
                <h3 style="margin-top:0.5rem; margin-bottom: 1rem">Occupancy Map Visualization</h3>
                <div class="occupancy-grid" id="occ-grid">
                    <!-- JS will populate 64 cells -->
                </div>
            </div>

            <div class="log-box" id="action-log">
                <div class="log-entry">Waiting for game to start...</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        const API_BASE = "http://localhost:8000";
        let board = null;
        let game = new Chess();
        let noiseLevel = 0.05;

        // Initialize UI Elements
        const $statusIndicator = $('#status-indicator');
        const $statusText = $('#status-text');
        const $noiseVal = $('#noise-val');
        const $occGrid = $('#occ-grid');
        const $logBox = $('#action-log');

        // Create 64 cells for the occupancy map
        for(let i=0; i<64; i++){
            $occGrid.append(`<div class="occ-cell" id="occ-${i}"></div>`);
        }

        // Noise Slider Event
        $('#noise-slider').on('input', function() {
            noiseLevel = parseFloat($(this).val());
            $noiseVal.text(noiseLevel.toFixed(2));
            renderOccupancy(game.fen());
        });

        function log(msg) {
            $logBox.prepend(`<div class="log-entry">${msg}</div>`);
        }

        // Check Server Health
        async function checkServer() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                if (res.ok) {
                    $statusIndicator.removeClass('offline').addClass('online');
                    $statusText.text('Server Online');
                } else {
                    throw new Error();
                }
            } catch(e) {
                $statusIndicator.removeClass('online').addClass('offline');
                $statusText.text('Server Offline');
            }
        }
        setInterval(checkServer, 3000);
        checkServer();

        // Occupancy Map Generation
        function getOccupancy(fen) {
            const tempChess = new Chess(fen);
            let occ = [];
            for (let r = 0; r < 8; r++) {
                let row = [];
                for (let c = 0; c < 8; c++) {
                    const file = String.fromCharCode('a'.charCodeAt(0) + c);
                    const rank = 8 - r;
                    const sq = file + rank;
                    const piece = tempChess.get(sq);
                    row.push(piece ? 1.0 : 0.0);
                }
                occ.push(row);
            }
            return occ;
        }

        function addNoiseAndClip(occ, noise) {
            let noisy = [];
            for(let r=0; r<8; r++){
                let row = [];
                for(let c=0; c<8; c++){
                    let u1 = Math.random();
                    let u2 = Math.random();
                    let z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
                    let val = occ[r][c] + (z0 * noise);
                    val = Math.max(0, Math.min(1, val));
                    row.push(val);
                }
                noisy.push(row);
            }
            return noisy;
        }

        function renderOccupancy(fen) {
            let occ = getOccupancy(fen);
            let noisy = addNoiseAndClip(occ, noiseLevel);
            let idx = 0;
            for(let r=0; r<8; r++){
                for(let c=0; c<8; c++){
                    let val = noisy[r][c];
                    // Map 0 -> black, 1 -> cyan (rgb(56, 189, 248))
                    let rColor = Math.floor(val * 56);
                    let gColor = Math.floor(val * 189);
                    let bColor = Math.floor(val * 248);
                    $(`#occ-${idx}`).css('background-color', `rgb(${rColor},${gColor},${bColor})`);
                    idx++;
                }
            }
            return noisy;
        }

        // Logic for human move inference
        function onDrop(source, target) {
            // Predict what the move looks like to the camera
            const tempGame = new Chess(game.fen());
            const moveResult = tempGame.move({ from: source, to: target, promotion: 'q' });
            
            if (moveResult === null) return 'snapback'; // Illegal physical move

            log(`Human moved piece to ${target}. Camera analyzing...`);

            // 1. Calculate Noisy Occupancy Map of the NEW state
            let noisyOcc = renderOccupancy(tempGame.fen());

            // Run async API calls without blocking the onDrop return
            processMoveInference(noisyOcc);
        }

        async function processMoveInference(noisyOcc) {
            // 2. Ask Inference Server what move it sees based on OLD fen and NEW occupancy
            try {
                const res = await fetch(`${API_BASE}/infer_move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fen: game.fen(),
                        occupancy_map: noisyOcc
                    })
                });
                
                const data = await res.json();
                
                if (!data.best_move || data.best_move === "0000") {
                    log(`<strong>CV Engine Error:</strong> Failed to detect move (Confidence: ${data.confidence.toFixed(4)})`);
                    // Snap the UI board back to the real game state if CV fails
                    board.position(game.fen());
                    return;
                }

                log(`<strong>CV Detected:</strong> ${data.best_move} (Confidence: ${data.confidence.toFixed(4)})`);
                
                // Officially apply the move recognized by CV
                game.move(data.best_move, {sloppy: true});
                board.position(game.fen());
                
                // Trigger Computer's turn
                setTimeout(makeComputerMove, 500);

            } catch (err) {
                log(`<strong>Server Error:</strong> Could not reach inference API.`);
                // Snap the UI board back to the real game state if server is offline
                board.position(game.fen());
            }
        }

        async function makeComputerMove() {
            if (game.game_over()) {
                log("<strong>Game Over!</strong>");
                return;
            }

            log(`Stockfish is thinking...`);
            try {
                const res = await fetch(`${API_BASE}/best_move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fen: game.fen() })
                });
                const data = await res.json();
                
                if(data.best_move) {
                    game.move(data.best_move, {sloppy: true});
                    board.position(game.fen());
                    renderOccupancy(game.fen());
                    log(`<strong>Stockfish played:</strong> ${data.best_move}`);
                }
            } catch(e) {
                log(`<strong>Server Error:</strong> Could not reach Stockfish API.`);
            }
        }

        const boardConfig = {
            draggable: true,
            position: 'start',
            onDrop: onDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('board', boardConfig);
        renderOccupancy(game.fen());

    </script>
</body>
</html>
